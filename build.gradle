plugins {
    id 'com.android.application' version '9.5.1'
    id 'org.jetbrains.kotlin.android' version '2.4.21' apply false
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.21'
    id 'com.google.devtools.ksp' version '2.3.14'
}

android {
    namespace 'com.gefolgwar.readwithkid'
    compileSdk 36

    defaultConfig {
        applicationId "com.gefolgwar.readwithkid"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64', 'x86'
        }
    }

    // Play upload key: read from keystore.properties (not in git) or environment variables.
    // Without them the release build is left unsigned. See README, section 4.
    def keystoreProps = new Properties()
    def keystorePropsFile = rootProject.file('keystore.properties')
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }
    def uploadKey = { String prop, String env -> keystoreProps.getProperty(prop) ?: System.getenv(env) }
    def uploadStoreFile = uploadKey('storeFile', 'RWK_UPLOAD_STORE_FILE')

    signingConfigs {
        if (uploadStoreFile) {
            upload {
                storeFile rootProject.file(uploadStoreFile)
                storePassword uploadKey('storePassword', 'RWK_UPLOAD_STORE_PASSWORD')
                keyAlias uploadKey('keyAlias', 'RWK_UPLOAD_KEY_ALIAS')
                keyPassword uploadKey('keyPassword', 'RWK_UPLOAD_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (uploadStoreFile) {
                signingConfig signingConfigs.upload
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
    }

    assetPacks = [':model_uk', ':model_de']
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2026.06.01')

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.1'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.room:room-runtime:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'

    implementation 'com.google.android.play:asset-delivery:2.3.0'

    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    // Real org.json for JVM unit tests (android.jar only ships stubs)
    testImplementation 'org.json:json:20240303'
    // Real Room database in JVM unit tests
    testImplementation 'org.robolectric:robolectric:4.18'
    testImplementation 'androidx.test:core:1.7.0'
}
