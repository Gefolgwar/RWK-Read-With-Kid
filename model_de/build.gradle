plugins {
    id 'com.android.asset-pack'
}

// On-demand Play asset pack with the German Vosk model (vosk-model-small-de-0.15, Apache 2.0).
// Not small-de-zamia: that one is LGPL-3.0. The model zip is not in git: see README, section 1.
assetPack {
    packName = "model_de"
    dynamicDelivery {
        deliveryType = "on-demand"
    }
}
